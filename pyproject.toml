[project]
name = "mimspy"
dynamic = ["version"]
description = "NGF GUI for Minerva NIMS"
authors = [
    { name = "Brady Fry", email = "dev@chaytus.com" }
]
dependencies = [
    "pyside6>=6.8.2",
    "pyserial>=3.5",
    "loguru>=0.7.3",
]
readme = "README.md"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.hatch.version]
path = "src/mimspy/configs/__init__.py"

[tool.rye]
managed = true
virtual = true
universal = true
dev-dependencies = [
  "dmgbuild>=1.6.4",
  "pyinstaller>=6.11.1",
  "click>=8.1.8",
  "toml>=0.10.2",
  "python-dotenv>=1.0.1",
  "commitizen>=4.1.1",
  "deptry>=0.23.0",
  "mike>=2.1.3",
  "mkdocs>=1.6.1",
  "mkdocstrings>=0.24.1",
  "mkdocs-macros-plugin>=1.0.5",
  "mkdocs-material>=9.5.43",
  "mkdocs-material[imaging]>=9.5.14",
  "mkdocstrings-python>=1.12.2",
  "mypy>=1.15.0",
  "pip-audit>=2.7.3",
  "pre-commit>=4.0.1",
  "pyproject-fmt>=2.5.0",
  "pyright>=1.1.387",
  "pytest>=8.3.3",
  "pytest-cov>=6.0.0",
  "python-kacl>=0.6.2",
  "ruff>=0.7.2",
  "validate-pyproject>=0.23",
  "scipy-stubs>=1.15.1.0",
  "types-python-dateutil>=2.9.0.20241206",
  "types-toml>=0.10.8.20240310",
]

[tool.rye.scripts]
app = "python src/app.py"
spec = "python pyinstaller.py -s"
assemble = "python pyinstaller.py -a"
dmg = "python pyinstaller.py -d"
ui = "pyside6-uic src/mimspy/ui/main.ui -o src/mimspy/ui/main.py"
#changelog = "python generate_changelog.py"
changelog = "cz changelog --file-name changelog.rst"
pyright = "pyright"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
pythonpath = [ "src" ]
addopts = "--cov=src/ --cov-report=term-missing"

[tool.mypy]
python_version = 3.12
python_executable = ".venv/bin/python"
show_error_codes = true
exclude = ["src/mimspy/ui/main.py"]

check_untyped_defs = true
disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pyright]
venvPath = "."          # rye installs the venv in the current dir
venv = ".venv"          #       in a folder called `.venv`
include = ["src"]
strict = ["**/*.py"]    # use 'strict' checking on all files
exclude = ["src/mimspy/ui/main.py"]
pythonVersion = "3.12"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.3"
version_files = [ "src/mimspy/configs/__init__.py:^__version__" ]
annotated_tag = true
incremental = true
update_changelog_on_bump = true
check_consistency = true

[tool.commitizen.change_type_map]
feat = "Enhancements"
fix = "Bug Fixes"
perf = "Performance"
refactor = "Refactor"
docs = "Documentation"
