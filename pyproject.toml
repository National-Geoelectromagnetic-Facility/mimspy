[project]
name = "mimspy"
description = "NGF GUI for Minerva NIMS"
readme = "README.md"
license = { text = "MIT" }

authors = [
  { name = "Brady Fry", email = "dev@chaytus.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = [ "version" ]
dependencies = [
  "loguru>=0.7.3",
  "pyserial>=3.5",
  "pyside6>=6.8.2",
]

[dependency-groups]
dev = [
  "click>=8.1.8",
  "commitizen>=4.1.1",
  "deptry>=0.23",
  "dmgbuild>=1.6.4",
  "mike>=2.1.3",
  "mkdocs>=1.6.1",
  "mkdocs-macros-plugin>=1.0.5",
  "mkdocs-material>=9.5.43",
  "mkdocs-material[imaging]>=9.5.14",
  "mkdocstrings>=0.24.1",
  "mkdocstrings-python>=1.12.2",
  "mypy>=1.15",
  "pip-audit>=2.7.3",
  "pre-commit>=4.0.1",
  "pyinstaller>=6.11.1",
  "pyproject-fmt>=2.5",
  "pyright>=1.1.387",
  "pytest>=8.3.3",
  "pytest-cov>=6",
  "python-dotenv>=1.0.1",
  "python-kacl>=0.6.2",
  "ruff>=0.7.2",
  "scipy-stubs>=1.15.1",
  "toml>=0.10.2",
  "types-pyserial>=3.5.0.20250130",
  "types-python-dateutil>=2.9.0.20241206",
  "types-toml>=0.10.8.20240310",
  "validate-pyproject>=0.23",
]

[tool.hatch.version]
path = "src/mimspy/configs/__init__.py"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
pythonpath = [ "src" ]
addopts = "--cov=src/ --cov-report=term-missing"

[tool.mypy]
python_version = 3.12
python_executable = ".venv/bin/python"
show_error_codes = true
exclude = [ "src/mimspy/ui/main.py" ]

check_untyped_defs = true
disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
  "mimspy.ui.main",
]
ignore_errors = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = [ "src" ]
strict = [ "**/*.py" ]
exclude = [ "src/mimspy/ui/main.py" ]
pythonVersion = "3.12"

[tool.uv]
package = false

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.4"
version_files = [ "src/mimspy/configs/__init__.py:^__version__" ]
annotated_tag = true
incremental = true
update_changelog_on_bump = true
check_consistency = true

[tool.commitizen.change_type_map]
feat = "Enhancements"
fix = "Bug Fixes"
perf = "Performance"
refactor = "Refactor"
docs = "Documentation"
