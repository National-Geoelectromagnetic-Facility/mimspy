#
#         echo "Notarize app"
#         xcrun notarytool submit "Aprespy.zip" --keychain-profile "notarytool-profile" --wait
#
#         # Finally, we need to "attach the staple" to our executable, which will allow our app to be
#         # validated by macOS even when an internet connection is not available.
#         echo "Attach staple"
#         xcrun stapler staple "dist/Aprespy.app"
#
#      - name: macOS-Clean up keychain and provisioning profile
#        if: matrix.os == 'macos-latest'
#        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db

      - name: macOS-Create dmg
        if: matrix.os == 'macos-latest'
        run: rye run dmg

      - name: Windows-Create list directory
        if: matrix.os == 'windows-latest'
        run: ls dist

      - name: Windows-Create zip
        if: matrix.os == 'windows-latest'
        run: 7z a Mimspy.zip .\dist\Mimspy.exe

      - name: macOS-Upload artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Mimspy_macOS
          path: Mimspy.dmg
          retention-days: 1

      - name: Windows-Upload artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Mimspy_windows
          path: Mimspy.zip
          retention-days: 1

  changelog-tag:
    name: Generate Changelog
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.get_version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT


      - name: Generate Changelog
        id: read_changelog
        run: |
          python generate_changelog.py &&
          mv CHANGELOG.rst ${{ github.workspace }}/changelog.rst

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: ${{ github.workspace }}/changelog.rst
          retention-days: 1

  create-release:
    name: Create Release
    needs: [build-app, changelog-tag]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: changelog

#      - uses: actions/download-artifact@v4
#        with:
#          name: Mimspy_macOS

      - uses: actions/download-artifact@v4
        with:
          name: Mimspy_windows

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          repository: ${{ secrets.PUB_OWNER }}/${{ secrets.PUB_REPO }}
          token: ${{ secrets.APRESPY_RELEASE_TOKEN }}
          name: Mimspy ${{ needs.changelog-tag.outputs.tag }}
          draft: false
          prerelease: false
          body_path: ${{ github.workspace }}/changelog.rst
          files: |
            Mimspy.zip
