# Assemble the Aprespy app for macOS and Windows using PyInstaller

name: CD Runner

on:
  push:
#    branches:
#      - "main"
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build-app:
    name: Build Application

    strategy:
      matrix:
        os:
#          - macos-latest
          - windows-latest
        python-version:
          - 3.12
        architecture:
          - x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up rye
        uses: eifinger/setup-rye@v4
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: rye sync

#      - name: macOS-Install the Apple signing certificate
