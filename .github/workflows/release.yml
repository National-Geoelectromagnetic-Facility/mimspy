# Assemble the Mimspy app for macOS and Windows using PyInstaller
# Apple app signing loosely based on the following guide:
# https://localazy.com/blog/how-to-automatically-sign-macos-apps-using-github-actions
# https://federicoterzi.com/blog/automatic-code-signing-and-notarization-for-macos-apps-using-github-actions/

name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+rc[0-9]+"

jobs:
  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: uv sync

      - name: Make spec file
        run: uv run python scripts/pyinstaller.py -s

      - name: Build App
        run: uv run python scripts/pyinstaller.py -a

      - name: Create zip
        run: 7z a Mimspy_${{ matrix.platform.target }}.zip .\dist\Mimspy.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mimspy_${{ matrix.platform.target }}._Windows
          path: Mimspy_${{ matrix.platform.target }}.zip
          retention-days: 1

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-13
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: uv sync

      - name: macOS-Install the Apple signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Make spec file
        env:
          OSX_BUNDLE_IDENTIFIER: ${{ secrets.OSX_BUNDLE_IDENTIFIER }}
          OSX_CODESIGN_IDENTITY: ${{ secrets.OSX_CODESIGN_IDENTITY }}
        run: uv run python scripts/pyinstaller.py -s

      - name: Build App
        run: uv run python scripts/pyinstaller.py -s

      - name: macOS-Notarize and Staple app
        env:
          NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          # Store the notarization credentials so that we can prevent a UI password dialog
          # from blocking the CI

          echo "Create keychain profile"
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "$NOTARIZATION_USERNAME" --team-id "$NOTARIZATION_TEAM_ID" --password "$NOTARIZATION_PASSWORD"

          # We can't notarize an app bundle directly, but we need to compress it as an archive.
          # Therefore, we create a zip file containing our app bundle, so that we can send it to the
          # notarization service

          echo "Creating temp notarization archive"
          ditto -c -k --keepParent "dist/Mimspy.app" "Mimspy.zip"

          # Here we send the notarization request to the Apple's Notarization service, waiting for the result.
          # This typically takes a few seconds inside a CI environment, but it might take more depending on the App
          # characteristics. Visit the Notarization docs for more information and strategies on how to optimize it if
          # you're curious

          echo "Notarize app"
          xcrun notarytool submit "Mimspy.zip" --keychain-profile "notarytool-profile" --wait

          # Finally, we need to "attach the staple" to our executable, which will allow our app to be
          # validated by macOS even when an internet connection is not available.
          echo "Attach staple"
          xcrun stapler staple "dist/Mimspy.app"

      - name: macOS-Create dmg
        run: uv run python scripts/pyinstaller.py -d -p ${{ matrix.platform.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mimspy_${{ matrix.platform.target }}
          path: Mimspy_${{ matrix.platform.target }}.dmg
          retention-days: 1

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.generate-changelog.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Get the version
        id: get_version
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Dependencies
        run: uv sync

      - name: Generate Changelog
        run: uv run changelog  ${{ steps.generate-changelog.outputs.tag }}

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.rst
          retention-days: 1

  create-release:
    name: Create Release
    needs: [ windows, macos, generate-changelog ]
    runs-on: ubuntu-latest

    steps:
#      - uses: actions/download-artifact@v4
#        with:
#          name: changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          repository: ${{ secrets.PUB_OWNER }}/${{ secrets.PUB_REPO }}
          token: ${{ secrets.MIMSPY_RELEASE_TOKEN }}
          name: ${{ needs.generate-changelog.outputs.tag }}
          draft: false
          prerelease: false
          body_path: changelog.rst
          files: |
            Mimspy_aarch64.dmg
            Mimspy_x86_64.dmg
            Mimspy_aarch64.zip
            Mimspy_x64.zip
