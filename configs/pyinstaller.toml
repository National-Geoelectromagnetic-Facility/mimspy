[project]
name = "Mimspy"
macos_icon = "src/mimspy/icons/NGF_logo_sqr.icns"
windows_icon = "src/mimspy/icons/NGF_logo_sqr.ico"
entry_point = "src/app.py"

[arguments]
base = [
	"--noconsole",
]

data = [
	"--add-data=src/mimspy/icons/NGF_logo_75_75.png:icons",
	"--add-data=src/mimspy/icons/check_green_50_50.png:icons",
	"--add-data=src/mimspy/icons/red_led_61_61.png:icons",
	"--add-data=src/mimspy/icons/yellow_led_61_61.png:icons",
	"--add-data=src/mimspy/icons/black_led_61_61.png:icons",
	"--add-data=src/mimspy/icons/green_led_61_61.png:icons",
	"--add-data=src/mimspy/icons/red_oval_58_29.png:icons",
	"--add-data=src/mimspy/icons/yellow_oval_58_29.png:icons",
	"--add-data=src/mimspy/icons/black_oval_58_29.png:icons",
	"--add-data=src/mimspy/icons/green_oval_58_29.png:icons",
	"--add-data=src/mimspy/icons/x_red_50_50.png:icons",
	"--add-data=src/mimspy/icons/NGF_logo_sqr.icns:icons",
	"--add-data=src/mimspy/icons/NGF_logo_sqr.ico:icons",
]

exclude = [
    "--exclude-module=FixTk",
    "--exclude-module=tcl",
    "--exclude-module=tk",
    "--exclude-module=_tkinter",
    "--exclude-module=tkinter",
    "--exclude-module=Tkinter",
    "--exclude-module=PyQt5",
    "--exclude-module=PySide2",
    "--exclude-module=shiboken2",
    "--exclude-module=Tkinter",
]

hidden = [
	"--hidden-import=ports",
]

macos = [
	"--onedir",
	"--osx-entitlements-file=configs/entitlements.plist",
]

windows = [
	"--onefile",
]
